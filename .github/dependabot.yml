version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: Etc/UTC
  # Zero stops Dependabot from opening pull requests; the fork takes CI updates from upstream.
  open-pull-requests-limit: 0
  reviewers:
  - str4d
  assignees:
  - str4d
  labels:
  - "A-CI"
